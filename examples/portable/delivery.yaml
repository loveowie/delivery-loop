version: 1
profile: portable

spec:
  provider: native

runtime:
  max_parallel_workers: 2
  max_task_attempts: 3
  no_progress_cycles: 3
  max_duration_hours: 8
  max_total_tokens: 2000000

verification:
  # The default container backend needs a digest-pinned image that already
  # exists locally. A trusted local project may instead select trusted-host in
  # a prepared copy of this file, after explicit user approval.
  commands:
    build: ["npm run build"]
    test: ["npm test"]
    lint: []
    e2e: []

git:
  mode: prepare-only
  worktree_isolation: true
