version: 1
profile: portable

spec:
  provider: native

runtime:
  max_parallel_workers: 2
  max_task_attempts: 3
  no_progress_cycles: 3
  max_duration_hours: 8
  max_total_tokens: 2000000

verification:
  commands:
    build: ["npm run build"]
    test: ["npm test"]
    lint: []
    e2e: []

git:
  mode: prepare-only
  worktree_isolation: true
